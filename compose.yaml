services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in root .env}
      MYSQL_DATABASE: football_management
      MYSQL_USER: football_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - football_mysql:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_procedures.sql:/docker-entrypoint-initdb.d/02_procedures.sql:ro
      - ./database/03_seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  football_mysql:
